name: Auto-merge

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

# ponytail: gated on Build only — Lint has been red on master since before the fork,
# so requiring it would deadlock every PR. Add "Lint" to workflows: once it's green.
jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          [ -n "$PR" ] || { echo "no same-repo PR attached to this run"; exit 0; }
          gh pr merge --merge --delete-branch "$PR"
